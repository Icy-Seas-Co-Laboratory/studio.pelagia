<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="1180" viewBox="0 0 760 1180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pelagia image analysis workflow</title>
  <desc id="desc">A simple vertical workflow diagram for Pelagia showing imagery acquisition, object detection and segmentation, scientific review and classification, and analysis-ready data export.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 4; }
      .box-red { fill: #ffffff; stroke: #b80000; stroke-width: 4; }
      .arrow { fill: #000000; }
      .label {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-weight: 400;
        font-size: 48px;
        letter-spacing: -0.03em;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .label-small {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-weight: 400;
        font-size: 44px;
        letter-spacing: -0.03em;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>

  <rect class="bg" width="760" height="1180" opacity="0"/>

  <rect x="46" y="36" width="668" height="210" rx="38" class="box"/>
  <text x="380" y="122" class="label">Imagery</text>
  <text x="380" y="178" class="label">Acquisition</text>

  <path class="arrow" d="M368 246 H392 V294 H428 L380 374 L332 294 H368 Z"/>

  <rect x="46" y="362" width="668" height="220" rx="38" class="box"/>
  <text x="380" y="448" class="label-small">Object Detection</text>
  <text x="380" y="506" class="label-small">&amp; Segmentation</text>

  <path class="arrow" d="M368 582 H392 V630 H428 L380 710 L332 630 H368 Z"/>

  <rect x="46" y="698" width="668" height="220" rx="38" class="box"/>
  <text x="380" y="784" class="label-small">Scientific Review</text>
  <text x="380" y="842" class="label-small">&amp; Classification</text>

  <path class="arrow" d="M368 918 H392 V966 H428 L380 1046 L332 966 H368 Z"/>

  <rect x="46" y="1034" width="668" height="110" rx="36" class="box-red"/>
  <text x="380" y="1091" class="label-small">Analysis-Ready Export</text>
</svg>
